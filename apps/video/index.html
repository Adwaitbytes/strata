<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>STRATA demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07080b; }
      #root { width: 100%; height: 100%; position: relative; background: #07080b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="85" data-width="1920" data-height="1080">
      <div id="s1-markets" data-composition-id="s1-markets" data-composition-src="compositions/s1-markets.html"
        data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2-thin" data-composition-id="s2-thin" data-composition-src="compositions/s2-thin.html"
        data-start="8" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3-arena" data-composition-id="s3-arena" data-composition-src="compositions/s3-arena.html"
        data-start="18" data-duration="17" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"
        data-variable-values='{"epochRoot":"[EPOCH_ROOT]"}'></div>
      <div id="s4-guards" data-composition-id="s4-guards" data-composition-src="compositions/s4-guards.html"
        data-start="35" data-duration="15" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5-proof" data-composition-id="s5-proof" data-composition-src="compositions/s5-proof.html"
        data-start="50" data-duration="20" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"
        data-variable-values='{"market":"[MARKET_SYMBOL]","spreadBps":"[SPREAD_BPS]","depthUsd":"[DEPTH_USD]"}'></div>
      <div id="s6-cta" data-composition-id="s6-cta" data-composition-src="compositions/s6-cta.html"
        data-start="70" data-duration="15" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"
        data-variable-values='{"appUrl":"[TESTNET_APP_URL]"}'></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="85" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080"
        style="z-index: 10"></div>
      <audio id="bed" class="clip" src="assets/audio/clean-soul-bed.m4a" data-start="0" data-duration="85"
        data-track-index="3" data-volume="1" data-fade-out="3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
