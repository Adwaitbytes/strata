name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  copy:
    name: Copy rules (em dash, hype words, emoji)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-copy.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Official image, pinned. Scans full history so a secret removed later still fails.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  node:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # @strata/contracts is a workspace package: its build and test tasks run forge.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (lockfile must be current)
        run: pnpm install --frozen-lockfile
      - name: Lint (package scripts)
        run: pnpm lint
      - name: Lint (root TypeScript rules)
        run: pnpm lint:root
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Nothing is installed here, so there is no pnpm store for the automatic cache to save.
          package-manager-cache: false
      # Gate: high or critical advisories in production dependencies. Accepted exceptions live in
      # pnpm-workspace.yaml (auditConfig.ignoreGhsas) and are explained in docs/SECURITY.md section 7.
      - name: pnpm audit, production dependencies (fails on high or critical)
        run: pnpm audit --prod --audit-level high
      # Report only: dev tooling (test runners, Lighthouse CI) never ships to a runtime.
      - name: pnpm audit, all dependencies (report only)
        continue-on-error: true
        run: pnpm audit --audit-level high

  contracts:
    name: Contracts (forge test, coverage, slither)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - name: forge fmt check
        run: forge fmt --check
      - name: forge build
        run: forge build --sizes
      - name: forge test
        run: forge test -vvv
      - name: forge coverage
        run: forge coverage --report summary --report lcov --no-match-coverage "(test|script|lib)/"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-coverage
          path: packages/contracts/lcov.info
          if-no-files-found: error
      # Slither runs on the runner with the pinned forge above. slither-action v0.4.1 ships a
      # Python too old for current slither-analyzer, so it is installed directly, pinned.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install slither
        run: python -m pip install --disable-pip-version-check "slither-analyzer==0.11.6"
      - name: slither (fails on high)
        run: slither . --filter-paths "lib/|test/|script/" --fail-high

  compose:
    name: Compose and image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file (all profiles)
        run: |
          docker compose -f infra/compose/stack.yml config -q
          docker compose -f infra/compose/stack.yml --profile testnet --profile mainnet config -q
      - name: Build service images
        run: docker compose -f infra/compose/stack.yml --profile testnet build

  workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
