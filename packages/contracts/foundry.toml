[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
# Source: docs.injective.network/developers-evm/network-information (PRD 4.3)
injective_testnet = "https://k8s.testnet.json-rpc.injective.network/"
injective_mainnet = "https://sentry.evm-rpc.injective.network/"
