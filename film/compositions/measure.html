        gx += items.length * PITCH + GROUP_GAP;
      });
      document.getElementById("measure-class-eq").textContent = `${CLASS_NAME.equity} ${groups[0].items.length}`;
      document.getElementById("measure-class-tail").textContent = groups.slice(1).map((g) => `${CLASS_NAME[g.cls]} ${g.items.length}`).join(" · ");

      // Callouts: the state of each named book at the sweep (levels from the sweep; WTI's spread from SPEC DATA)
      const stateOf = (m) => (m.sym === "WTI" ? "spread 164.8 bps" : m.bids === 0 && m.asks === 0 ? "empty book" : m.asks === 0 ? "no asks" : m.bids === 0 ? "no bids" : "");
      const MONO = 0.65; // Martian Mono advance at font-stretch 87.5%, in em
      const CALLS = [
        ["XAU", 5.36], // "Gold" 5.48
        ["WTI", 6.11], // "oil" 6.23
        ["USTECH", 7.32], // "Nasdaq" 7.44
        ["EURUSD", 8.25], // "euro" 8.37
        ["SICI", 9.43], // "GPU" 9.55
      ];
      const labels = document.getElementById("measure-labels");
      CALLS.forEach(([sym]) => {
        const m = markets[sym];
        const box = (m.call = div("measure-mono measure-call", "", labels));
        const state = stateOf(m);
        div("measure-call-sym", sym, box);
        div("measure-call-state", state, box);
        const width = Math.max(sym.length * 34 * MONO, state.length * 28 * MONO);
        const tx = m.x + TICK_W / 2;
        if (tx + 14 + width <= 1824) box.style.left = `${tx + 14}px`;
        else { box.classList.add("measure-right"); box.style.left = `${tx - 14 - width}px`; box.style.width = `${width}px`; }
        m.leader = svgEl("line", { x1: tx, x2: tx, y1: TOP - LIFT, y2: TOP - LIFT, stroke: INK, "stroke-width": 1.25 }, leadersG);
      });

      // The three that had both sides: ochre, named above the strip
      const THREE = [["META", "right"], ["MSTR", "left"], ["SPCX", "left"]];
      THREE.forEach(([sym, side]) => {
        const m = markets[sym];
        const tx = m.x + TICK_W / 2;
        const label = (m.label3 = div("measure-mono measure-three", sym, labels));
        const width = sym.length * 30 * MONO;
        label.style.left = `${side === "left" ? tx + 10 : tx - 10 - width}px`;
        m.leader3 = svgEl("line", { x1: tx, x2: tx, y1: 386, y2: 386, stroke: OCHRE, "stroke-width": 1.25 }, leadersG);
      });

      // Payoff ink metrics: 240 px Martian Mono "3" 17..139 px, "1" from 23.3 px; 80 px Schibsted "of" 3.5..72.6 px. Inks start on the x = 100 edge.
      const EDGE = 100, GAP = 28;
      const X3 = EDGE - 17;
      const XOF = X3 + 139 + GAP - 3.5;
      const X188 = XOF + 72.6 + GAP - 23.3;
      const X188_ALONE = EDGE - 23.3; // while 188 stands alone it sits on the edge, then makes room for "3 of"
      [["measure-n0", X3], ["measure-of", XOF], ["measure-n188", X188_ALONE]].forEach(([id, x]) => (document.getElementById(id).style.left = `${x}px`));

      // Rolling digit columns: a blank row, then 0 to 9 twice
      document.querySelectorAll(".measure-col").forEach((col) => [" ", ..."01234567890123456789"].forEach((d) => col.appendChild(Object.assign(document.createElement("span"), { textContent: d }))));

      const tl = gsap.timeline({ paused: true });
      const blurIn = (sel, t, d = 0.18) =>
        tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out" }, t);
      const blurOut = (sel, t, d = 0.18) =>
        tl.fromTo(sel, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: d, ease: "power3.in", immediateRender: false }, t);
      const roll = (col, t, cell = 240) => {
        tl.fromTo(col, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, t);
        tl.fromTo(col, { y: 0 }, { y: -(11 + Number(col.dataset.digit)) * cell, duration: 0.6, ease: "power3.out" }, t);
      };

      // 0 to 0.5: the camera travels down the same sheet, from the canyon to the survey (vertical smear at the fastest frames)
      tl.fromTo("#measure-sheet", { y: 0 }, { y: -960, duration: 0.5, ease: "power2.inOut" }, 0);
      tl.set("#measure-sheet", { filter: "url(#measure-vblur)" }, 0.034);
      tl.fromTo("#measure-vblur-k", { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: "0 12" }, duration: 0.25, ease: "power2.in" }, 0);
      tl.fromTo("#measure-vblur-k", { attr: { stdDeviation: "0 12" } }, { attr: { stdDeviation: "0 0" }, duration: 0.25, ease: "power2.out", immediateRender: false }, 0.25);
      tl.set("#measure-sheet", { filter: "none" }, 0.5);
      tl.set("#measure-gap", { opacity: 0 }, 0.5); // panned off the top; nothing left to paint

      // "measured" 0.82: the sheet title, word by word
      tl.fromTo("#measure-title .measure-w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.08, ease: "power2.out" }, 0.6);

      // "a hundred and eighty-eight" 3.78: 188 ticks rise off the datum left to right, each class bracketed, and 188 rolls in
      Object.values(markets).forEach((m) => {
        tl.fromTo(m.tick, { attr: { y: BASE, height: 0 } }, { attr: { y: TOP, height: BASE - TOP }, duration: 0.24, ease: "expo.out" }, wave(m.x, DRAW));
      });
      groups.forEach((g) => tl.fromTo(g.bracket, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, wave(g.x0, DRAW)));
      blurIn("#measure-class-eq", 3.95);
      document.querySelectorAll("#measure-n188 .measure-col").forEach((col, i) => roll(col, 4.08 + i * 0.04));
      blurIn("#measure-class-tail", 4.36);
      blurIn("#measure-cap-listed", 4.38); // "real-world" 4.46

      // Gold, oil, the Nasdaq, the euro, GPU compute: each tick lifts on its name and says what its book held
      CALLS.forEach(([sym, t], i) => {
        const m = markets[sym];
        const out = i + 1 < CALLS.length ? CALLS[i + 1][1] - 0.04 : 10.9;
        const box = m.call;
        tl.fromTo(m.tick, { attr: { y: TOP } }, { attr: { y: TOP - LIFT }, duration: 0.35, ease: "expo.out", immediateRender: false }, t);
        tl.fromTo(m.leader, { attr: { y2: TOP - LIFT } }, { attr: { y2: LEADER_TOP }, duration: 0.3, ease: "power2.out" }, t + 0.02);
        blurIn(box, t + 0.06);
        blurOut(box, out, 0.16);
        tl.fromTo(m.leader, { attr: { y2: LEADER_TOP } }, { attr: { y2: TOP - LIFT }, duration: 0.2, ease: "power3.in", immediateRender: false }, out);
        tl.fromTo(m.tick, { attr: { y: TOP - LIFT } }, { attr: { y: TOP }, duration: 0.3, ease: "power3.in", immediateRender: false }, out);
      });

      // "Monday morning" 11.38
      blurIn("#measure-date", 11.26);

      // Before "only three": every book without a bid and an ask within 0.25% goes hollow; three fill ochre
      blurOut("#measure-cap-listed", 12.3, 0.2);
      Object.values(markets).forEach((m) => {
        const t = wave(m.x, HOLLOW_AT);
        if (m.both) tl.fromTo(m.tick, { fill: INK, stroke: INK, strokeWidth: 1.25 }, { fill: OCHRE, stroke: OCHRE, strokeWidth: 2, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
        else tl.fromTo(m.tick, { fillOpacity: 1, stroke: INK }, { fillOpacity: 0, stroke: HOLLOW, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
      });
      THREE.forEach(([sym], i) => {
        const m = markets[sym];
        tl.fromTo(m.leader3, { attr: { y2: 386 } }, { attr: { y2: 398 }, duration: 0.2, ease: "power2.out" }, 12.78 + i * 0.06);
        blurIn(m.label3, 12.8 + i * 0.06);
      });

      // "three" 13.21: 188 makes room, the ochre 3 rolls in, "of" joins them: 3 of 188
      tl.fromTo("#measure-n188", { x: 0 }, { x: X188 - X188_ALONE, duration: 0.45, ease: "power3.inOut" }, 12.98);
      roll(document.querySelector("#measure-n0 .measure-col"), 13.26);
      blurIn("#measure-of", 13.36);
      // "had a buyer and a seller" 14.2
      blurIn("#measure-cap-both", 14.08);
      // Provenance, then hold
      blurIn("#measure-foot", 15.5);

      window.__timelines["measure"] = tl;
    })();
  </script>
</template>
