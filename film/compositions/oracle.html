    #oracle-axis { display: block; margin-top: 18px; width: 1112px; height: 164px; overflow: visible; }
    #oracle-axis text { font-family: "Martian Mono", monospace; font-stretch: 87.5%; font-feature-settings: "tnum" 1, "zero" 1; font-size: 28px; }

    /* the guard rule */
    #oracle-rule { left: 640px; top: 828px; font-size: 48px; color: #ECE8DF; }
    .oracle-le { display: inline-block; width: 0.6em; height: 0.72em; vertical-align: -0.01em; overflow: visible; }

    /* the freeze: real event line over the held frame */
    #oracle-event-card { left: 96px; top: 548px; padding: 34px 48px 34px 44px; white-space: nowrap; }
    .oracle-ev-head { font-size: 50px; line-height: 1.15; display: flex; align-items: baseline; gap: 18px; }
    .oracle-ev-head .oracle-body { font-weight: 500; }
    .oracle-ev-head .oracle-mono { font-size: 42px; }
    .oracle-ev-sep { color: #8E897E; }
    .oracle-ev-sentence { font-size: 44px; line-height: 1.3; margin-top: 16px; }
    .oracle-ev-sentence .oracle-mono { font-size: 40px; }
    .oracle-ev-date { font-size: 30px; line-height: 1; margin-top: 22px; display: flex; align-items: center; gap: 16px; color: #B4AFA3; }
  </style>

  <div id="root" data-composition-id="oracle" data-width="1920" data-height="1080" data-duration="18.4">

    <!-- 0 to 14.533: the basalt sheet (title, Ostium, report card, rule) -->
    <div id="oracle-stage" class="clip" data-start="0" data-duration="14.5333" data-track-index="1">
      <div id="oracle-title" class="oracle-abs oracle-display">
        <span class="oracle-w">Guards</span> <span class="oracle-w">the</span> <span class="oracle-w">AI</span> <span class="oracle-w oracle-accent">can’t</span> <span class="oracle-w oracle-accent">touch</span>
      </div>
      <svg id="oracle-title-rule" viewBox="0 0 1728 18" aria-hidden="true"></svg>
      <div class="oracle-station" id="oracle-st-1" style="left:96px"></div>
      <div class="oracle-station" id="oracle-st-2" style="left:588px"></div>
      <div class="oracle-station" id="oracle-st-3" style="left:972px"></div>
      <div class="oracle-station" id="oracle-st-4" style="left:1488px"></div>
      <div class="oracle-legend oracle-mono" id="oracle-lg-1" style="left:96px"><div class="oracle-legend-name">Oracle guard</div><div class="oracle-legend-note">stale or future prices</div></div>
      <div class="oracle-legend oracle-mono" id="oracle-lg-2" style="left:588px"><div class="oracle-legend-name">Session guard</div><div class="oracle-legend-note">market hours</div></div>
      <div class="oracle-legend oracle-mono" id="oracle-lg-3" style="left:972px"><div class="oracle-legend-name">Risk governor</div><div class="oracle-legend-note">loss and exposure limits</div></div>
      <div class="oracle-legend oracle-mono" id="oracle-lg-4" style="left:1488px"><div class="oracle-legend-name">Kill switch</div><div class="oracle-legend-note">one signed message</div></div>

      <div id="oracle-ost-kicker" class="oracle-abs oracle-mono oracle-muted">Ostium, July 2026</div>
      <div id="oracle-ost-num" class="oracle-abs oracle-mono" data-layout-ignore><span class="oracle-glyph" id="oracle-ost-dollar">$</span><span class="oracle-roll" data-d="1"></span><span class="oracle-roll" data-d="8"></span><span class="oracle-glyph" id="oracle-ost-m">M</span></div>

      <div id="oracle-card" class="oracle-panel">
        <div class="oracle-card-head">

          <span class="oracle-badge oracle-mono">Illustration</span>
        </div>
        <div class="oracle-hair"></div>
        <div class="oracle-row" id="oracle-row-report">

        <div class="oracle-row" id="oracle-row-chain">

      <div id="oracle-rule" class="oracle-abs oracle-mono">report time <svg class="oracle-le" viewBox="0 0 100 120" aria-hidden="true"><path d="M86 8 L16 44 L86 80 M16 112 L86 112" fill="none" stroke="#ECE8DF" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/></svg> chain time + 2 s</div>
    </div>

    <!-- dip cut: the sheet darkens 40% for 3 frames, then a hard cut into B4 -->

    <!-- B4: the fault cracks the land. Plays source frames 20 to 61: the fault races across frames 34 to 56 (local 15.00 to 15.73)
         and the render holds still from frame 61, the frame b4-freeze.jpg is exported from, so the freeze is seamless -->
    <video id="oracle-b4" class="clip" src="assets/video/b4.mp4" muted playsinline data-start="14.5333" data-duration="1.4" data-media-start="0.6667" data-hf-media-start-basis="local" data-track-index="3"></video>

    <!-- the freeze: time stops on "stops quoting" -->
    <img id="oracle-freeze" class="clip" src="assets/video/b4-freeze.jpg" alt="" data-start="15.9333" data-duration="2.4667" data-track-index="4" />
    <div id="oracle-event" class="clip" data-start="15.9333" data-duration="2.4667" data-track-index="5">
      <div id="oracle-event-card" class="oracle-panel">
        <div class="oracle-ev-head">
          <span class="oracle-body">Oracle guard</span><span class="oracle-ev-sep oracle-mono">·</span><span class="oracle-mono oracle-halt">halt</span><span class="oracle-ev-sep oracle-mono">·</span><span class="oracle-mono">BHA-PERP</span>
        </div>
        <div class="oracle-ev-sentence oracle-body">Oracle report is <span class="oracle-mono">58,999.81</span> s old, limit is <span class="oracle-mono">30</span> s.</div>
        <div class="oracle-ev-date oracle-mono"><span>9 Nov 2026, 08:20:57 UTC</span><span class="oracle-ev-sep">·</span><span class="oracle-badge">TESTNET</span></div>
      </div>

    <!-- B4 is an illustration over the real land: labelled for as long as it is on screen -->

  <script>
    // Scene-local seconds. Word times from cues.json (l08): the 1.17, AI 1.49, can't 1.60, touch 2.02,
    // July 3.45, lost 4.55, stamped 8.01, future 8.83, checks 10.76, chain 12.95, wrong 14.65, stops 16.05.
    const T = {
      the: 1.05, ai: 1.38, cant: 1.48, touch: 1.9, legend: 1.9, quiet: 3.15,
      kicker: 3.1, num: 3.15, line: 4.45, src: 4.75,
      lineOut: 8.38, park: 8.45, card: 8.75, fault: 9.25, measure: 10.62, rule: 12.8,
    };

    // ---- build-time geometry (deterministic, no layout reads) ----
    const NS = "http://www.w3.org/2000/svg";
    const svgEl = (tag, attrs) => {
      const el = document.createElementNS(NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    };

    // measured rule under the title: hairline with a tick every 24 px and an index tick every 120 px
    const titleRule = document.getElementById("oracle-title-rule");
    titleRule.appendChild(svgEl("line", { x1: 0, y1: 17, x2: 1728, y2: 17, stroke: "#373D39", "stroke-width": 2 }));
    for (let x = 0; x <= 1728; x += 24) {
      const major = x % 120 === 0;
      titleRule.appendChild(svgEl("line", { x1: x + 0.5, y1: major ? 3 : 10, x2: x + 0.5, y2: 17, stroke: major ? "#8E897E" : "#373D39", "stroke-width": major ? 2 : 1.5 }));
    }

    // rolling digit columns: 0-9 twice so every digit travels at least ten rows
    document.querySelectorAll("#root .oracle-roll").forEach((cell) => {
      const col = document.createElement("span");
      col.className = "oracle-col";
      for (let i = 0; i < 20; i++) {
        const s = document.createElement("span");
        s.textContent = String(i % 10);
        col.appendChild(s);
      }
      cell.appendChild(col);
    });

    // time axis of the illustrated report: chain time at X0, 26 px per second, +41 s at the right
    const axis = document.getElementById("oracle-axis");
    const AW = 1112, X0 = 14, PX = 26, AY = 104;
    const XL = X0 + 2 * PX;   // chain time + 2 s
    const XR = X0 + 35 * PX;  // report 20:00:41 is 35 s after chain 20:00:06
    axis.appendChild(svgEl("line", { x1: 0, y1: AY, x2: AW, y2: AY, stroke: "#373D39", "stroke-width": 2 }));
    for (let s = 0; s <= 41; s++) {
      const x = X0 + s * PX;
      const major = s % 10 === 0;
      axis.appendChild(svgEl("line", { x1: x, y1: major ? AY - 16 : AY - 7, x2: x, y2: AY, stroke: major ? "#8E897E" : "#373D39", "stroke-width": major ? 2 : 1.5 }));
    }
    const band = axis.appendChild(svgEl("rect", { id: "oracle-band", x: X0, y: AY - 26, width: XL - X0, height: 26, fill: "#ECE8DF", "fill-opacity": 0.16, opacity: 0 }));
    const limit = axis.appendChild(svgEl("line", { id: "oracle-limit", x1: XL, y1: 40, x2: XL, y2: AY + 12, stroke: "#ECE8DF", "stroke-width": 2, "stroke-dasharray": "5 5", opacity: 0 }));
    const limitLabel = axis.appendChild(svgEl("text", { id: "oracle-limit-label", x: XL + 10, y: 30, fill: "#ECE8DF", opacity: 0 }));
    limitLabel.textContent = "+2 s";
    axis.appendChild(svgEl("line", { x1: X0, y1: 58, x2: X0, y2: AY + 12, stroke: "#ECE8DF", "stroke-width": 3 }));
    const chainLabel = axis.appendChild(svgEl("text", { x: X0, y: 158, fill: "#B4AFA3" }));
    chainLabel.textContent = "chain";
    const reportMark = axis.appendChild(svgEl("line", { id: "oracle-report-mark", x1: XR, y1: 58, x2: XR, y2: AY + 12, stroke: "#ECE8DF", "stroke-width": 3 }));
    const reportLabel = axis.appendChild(svgEl("text", { id: "oracle-report-label", x: XR, y: 158, fill: "#B4AFA3", "text-anchor": "middle" }));
    reportLabel.textContent = "report";
    // the measurement between chain and report, drawn on "checks"
    const dimY = 48, dimLen = XR - X0;
    const dim = axis.appendChild(svgEl("path", { id: "oracle-dim", d: `M${X0} ${dimY} H${XR}`, stroke: "#ECE8DF", "stroke-width": 2, fill: "none", "stroke-dasharray": dimLen, "stroke-dashoffset": dimLen }));
    const dimTickA = axis.appendChild(svgEl("line", { x1: X0, y1: dimY - 9, x2: X0, y2: dimY + 9, stroke: "#ECE8DF", "stroke-width": 2, opacity: 0 }));
    const dimTickB = axis.appendChild(svgEl("line", { x1: XR, y1: dimY - 9, x2: XR, y2: dimY + 9, stroke: "#ECE8DF", "stroke-width": 2, opacity: 0 }));
    const dimLabel = axis.appendChild(svgEl("text", { x: (X0 + XR) / 2, y: 34, fill: "#ECE8DF", "text-anchor": "middle", opacity: 0 }));
    dimLabel.textContent = "+35 s";

    // ---- timeline ----
    const tl = gsap.timeline({ paused: true });
    const blurIn = (sel, t, d = 0.18) =>
      tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out" }, t);

    // the header: "Guards" is landed at frame 0; each word lands on its spoken word, the accent on "can't touch"
    const words = document.querySelectorAll("#oracle-title .oracle-w");
    [T.the, T.ai, T.cant, T.touch].forEach((t, i) => blurIn(words[i + 1], t));

    // on "touch": the four guards land on the ruler, 0.08 s apart; when $18M rolls in, the row steps back to a
    // quiet band and only Oracle guard (this scene's guard) keeps its chalk name
    for (let i = 1; i <= 4; i++) {
      blurIn([`#oracle-st-${i}`, `#oracle-lg-${i}`], T.legend + (i - 1) * 0.08);
    }
    tl.to(["#oracle-lg-2 .oracle-legend-name", "#oracle-lg-3 .oracle-legend-name", "#oracle-lg-4 .oracle-legend-name"], { color: "#8E897E", duration: 0.3, ease: "power2.inOut" }, T.quiet);
    tl.to("#oracle-stage .oracle-legend-note", { color: "#8E897E", duration: 0.3, ease: "power2.inOut" }, T.quiet);
    tl.to(["#oracle-st-2", "#oracle-st-3", "#oracle-st-4"], { backgroundColor: "#373D39", duration: 0.3, ease: "power2.inOut" }, T.quiet);

    // beat 2: on "July", Ostium, July 2026 and the giant $18M; its line on "lost"
    blurIn("#oracle-ost-kicker", T.kicker);
    blurIn(["#oracle-ost-dollar", "#oracle-ost-m"], T.num, 0.22);
    document.querySelectorAll("#oracle-ost-num .oracle-roll").forEach((cell, i) => {
      const d = Number(cell.dataset.d);
      const col = cell.querySelector(".oracle-col");
      tl.fromTo(cell, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, T.num + i * 0.04);
      tl.fromTo(col, { yPercent: 0 }, { yPercent: -5 * (10 + d), duration: 0.6, ease: "power3.out" }, T.num + i * 0.04);
    });
    blurIn("#oracle-ost-line", T.line);
    blurIn("#oracle-ost-src", T.src);

    // the card is about to take the stage: the line leaves, $18M parks at half size under its kicker, the source follows it up
    tl.to("#oracle-ost-line", { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, T.lineOut);
    tl.fromTo("#oracle-ost-num", { scale: 1 }, { scale: 0.5, duration: 0.9, ease: "power2.inOut" }, T.park);
    tl.fromTo("#oracle-ost-src", { y: 0 }, { y: -208, duration: 0.9, ease: "power2.inOut" }, T.park + 0.12);

    // beat 3: the illustrated report card lands on "future"; its report row turns halt red
    tl.fromTo("#oracle-card", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "power2.out" }, T.card);
    tl.to("#oracle-row-report .oracle-row-label, #oracle-row-report .oracle-row-value", { color: "#F0656E", duration: 0.16, ease: "power2.out" }, T.fault);
    tl.to(reportMark, { attr: { stroke: "#F0656E" }, duration: 0.16, ease: "power2.out" }, T.fault);
    tl.to(reportLabel, { attr: { fill: "#F0656E" }, duration: 0.16, ease: "power2.out" }, T.fault);

    // "checks": the gap between report and chain is measured, end ticks first, then the line draws
    tl.to([dimTickA, dimTickB], { opacity: 1, duration: 0.12, ease: "power2.out" }, T.measure);
    tl.to(dim, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.inOut" }, T.measure + 0.05);
    tl.to(dimLabel, { opacity: 1, duration: 0.18, ease: "power2.out" }, T.measure + 0.5);

    // "chain time": the rule lands; the +2 s limit marks itself on the axis 0.12 s behind it
    blurIn("#oracle-rule", T.rule, 0.2);
    tl.to(["#oracle-band", "#oracle-limit", "#oracle-limit-label"], { opacity: 1, duration: 0.3, ease: "power2.out" }, T.rule + 0.12);

    // dip cut, B4 and the freeze are clip windows: no tweens, so the stop is absolute

    window.__timelines["oracle"] = tl;
  </script>
