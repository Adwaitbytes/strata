  <script>
    // Camera views: screen = design * scale + (x, y). The sheet spans x 0..3456, y -786..362.
    // Station text spans (design x): 1 0..667, 2 807..1361, 3 1501..2021, 4 2161..2802, 5 2942..3454.
    // Each held view puts both frame edges in a gap between stations, so no label is ever cut:
    // it shows the station that just landed and the one before it, both whole.
    const HOW_VIEW = {
      open: { scale: 0.75, x: 100, y: 715 },  // title, station 1's ladder, the line
      sheet: { scale: 0.5, x: 96, y: 564 },   // the whole sheet, final pull back
      s1: { scale: 1, x: 626.5, y: 511 },     // frame x -626..1293: station 1 centred
      s2: { scale: 1, x: 100, y: 511 },       // frame x -100..1820: stations 1 and 2
      s3: { scale: 1, x: -700, y: 511 },      // frame x 700..2620: stations 2 and 3
      s4: { scale: 1, x: -1400, y: 511 },     // frame x 1400..3320: stations 3 and 4
    };

    // Ruler: 12 intervals of 5 s, 44 design px each; a sample dot on every tick.
    (() => {
      const ns = "http://www.w3.org/2000/svg";
      const ticks = document.getElementById("how-s2-ticks");
      const dots = document.getElementById("how-s2-dots");
      for (let j = 0; j <= 12; j += 1) {
        const x = 807 + j * 44 + (j === 0 ? 1.5 : j === 12 ? -1.5 : 0);
        const major = j % 6 === 0;
        const p = document.createElementNS(ns, "path");
        p.setAttribute("d", `M${x} -80V${major ? -136 : -112}`);
        ticks.appendChild(p);
        const c = document.createElementNS(ns, "circle");
        c.setAttribute("class", "how-dot");
        c.setAttribute("cx", String(807 + j * 44));
        c.setAttribute("cy", "-170");
        c.setAttribute("r", "8");
        dots.appendChild(c);
      }
    })();

    const blurIn = { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" };
    const blurFrom = { opacity: 0, filter: "blur(8px)" };

    const tl = gsap.timeline({ paused: true });
    tl.set("#how-cam", HOW_VIEW.open, 0);

    // Frame 0 opens on the object: the title, the survey line with its five stations, and
    // station 1's ladder (the real BTC quotes) already on the sheet. "Here's how it works" (0.54).

    // Push in to station 1. "An agent quotes both sides" (quotes 2.26)
    tl.to("#how-cam", { ...HOW_VIEW.s1, duration: 1.1, ease: "power2.inOut" }, 1.2);
    tl.to("#how-m1", { fill: "#141613", duration: 0.2, ease: "power2.out" }, 2.1);
    tl.fromTo("#how-s1-label", blurFrom, { ...blurIn }, 2.12);

    // Pan to station 2. "We measure it every five seconds" (measure 5.5, five 6.34)
    tl.to("#how-cam", { ...HOW_VIEW.s2, duration: 1.0, ease: "power2.inOut" }, 4.35);
    tl.fromTo("#how-s2-base", { strokeDasharray: 528, strokeDashoffset: 528 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 5.1);
    tl.fromTo("#how-s2-ticks path", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.3, ease: "expo.out", stagger: 0.035 }, 5.3);
    tl.to("#how-m2", { fill: "#141613", duration: 0.2, ease: "power2.out" }, 5.36);
    tl.fromTo("#how-s2-label", blurFrom, { ...blurIn }, 5.38);
    tl.fromTo("#how-s2-dots .how-dot", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "expo.out", stagger: 0.065 }, 5.55);
    tl.fromTo("#how-s2-dim", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, 6.2);
    tl.fromTo("#how-s2-dimt", blurFrom, { ...blurIn }, 6.2);
    tl.fromTo("#how-s2-sub", blurFrom, { ...blurIn }, 6.42);

    // Pan to station 3. "Every hour, we score it" (hour 7.48, score 8.12)
    tl.to("#how-cam", { ...HOW_VIEW.s3, duration: 0.95, ease: "power2.inOut" }, 6.95);
    tl.to("#how-m3", { fill: "#141613", duration: 0.2, ease: "power2.out" }, 7.9);
    tl.fromTo("#how-s3-label", blurFrom, { ...blurIn }, 7.92);
    // beds settle bottom first, like sediment
    const beds = gsap.utils.toArray("#how-s3-stack .how-bed").reverse();
    const bedLabels = gsap.utils.toArray(".how-s3-lt").reverse();
    beds.forEach((bed, i) => {
      tl.fromTo(bed, { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 7.98 + i * 0.1);
      tl.fromTo(bedLabels[i], { opacity: 0, filter: "blur(8px)" }, { ...blurIn }, 8.04 + i * 0.1);
    });
    tl.fromTo("#how-s3-sub", blurFrom, { ...blurIn }, 8.36);

    // Pan to station 4. "and post the result onchain" (post 8.92, onchain 9.96)
    tl.to("#how-cam", { ...HOW_VIEW.s4, duration: 0.9, ease: "power2.inOut" }, 8.8);
    tl.fromTo("#how-s4-leaves rect", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", stagger: 0.05 }, 9.2);
    tl.fromTo("#how-s4-tree .how-edge-a", { strokeDasharray: 160, strokeDashoffset: 160 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, 9.3);
    tl.fromTo("#how-s4-mids circle", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "expo.out" }, 9.55);
    tl.fromTo("#how-s4-tree .how-edge-b", { strokeDasharray: 210, strokeDashoffset: 210 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, 9.55);
    tl.fromTo("#how-s4-root", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.35, ease: "expo.out" }, 9.78);
    tl.to("#how-s4-root", { fill: "#8A560E", stroke: "#8A560E", duration: 0.2, ease: "power2.out" }, 9.84);
    tl.to("#how-m4", { fill: "#141613", duration: 0.2, ease: "power2.out" }, 9.8);
    tl.fromTo("#how-s4-label", blurFrom, { ...blurIn }, 9.82);
    tl.fromTo("#how-s4-sub", blurFrom, { ...blurIn }, 9.9);

    // Pull back to the whole sheet. "where anyone can check it" (anyone 11.08, check 11.83)
    // station 5 lands once the pull back has brought its label wholly inside the frame (11.1)
    tl.to("#how-cam", { ...HOW_VIEW.sheet, duration: 1.3, ease: "power2.inOut" }, 10.38);
    tl.to("#how-m5", { fill: "#141613", duration: 0.2, ease: "power2.out" }, 11.08);
    tl.fromTo("#how-s5-label", blurFrom, { ...blurIn }, 11.1);
    tl.fromTo("#how-s5-outer", { strokeDasharray: 943, strokeDashoffset: 943 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 11.0);
    tl.fromTo("#how-s5-inner", { strokeDasharray: 352, strokeDashoffset: 352 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 11.15);
    tl.fromTo(".how-s5-hair", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 11.35);
    tl.fromTo("#how-s5-check", { strokeDasharray: 90, strokeDashoffset: 90 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, 11.72);

    window.__timelines["how"] = tl;
  </script>
