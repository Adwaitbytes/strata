<template>
  <style>
    @font-face { font-family: "Martian Mono"; src: url("assets/fonts/MartianMono-latin.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; font-style: normal; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0D0F0E; }
    .open-mono { font-family: "Martian Mono", monospace; font-stretch: 87.5%; font-feature-settings: "tnum" 1, "zero" 1; white-space: nowrap; }

    /* Survey title block, lower left over the bid plateau: three lines stacked on a measured rule */
    #open-block { position: absolute; left: 96px; top: 704px; width: 740px; height: 172px; }
    #open-ticker { position: absolute; left: 0; top: 0; font-size: 34px; line-height: 44px; font-weight: 500; color: #ECE8DF; }
    #open-badge { position: absolute; left: 330px; top: 3px; height: 38px; padding: 0 12px; font-size: 28px; line-height: 36px;
      color: #B4AFA3; background: #161917; border: 1px solid #373D39; border-radius: 4px; letter-spacing: 0.04em; }
    #open-net { position: absolute; left: 0; top: 56px; font-size: 28px; line-height: 38px; color: #B4AFA3; }
    #open-date { position: absolute; left: 0; top: 98px; font-size: 28px; line-height: 38px; color: #B4AFA3; }
    #open-rule { position: absolute; left: 0; top: 150px; width: 724px; height: 20px; overflow: visible; }
  </style>
  <div id="root" data-composition-id="open" data-width="1920" data-height="1080" data-duration="8.2">
    <!-- B1: the dusk glide over the NVDA book, full-bleed from frame 0 (the thumbnail). 0.975x so the 8 s render covers 8.2 s and still ends moving. -->
    <video id="open-b1" class="clip" src="assets/video/b1.mp4" muted playsinline data-start="0" data-duration="8.2" data-playback-rate="0.975" data-track-index="0"
      style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover"></video>

    <div id="open-block" class="clip" data-start="0" data-duration="8.2" data-track-index="1">
      <div id="open-ticker" class="open-mono">NVDA/USDC PERP</div>
      <div id="open-badge" class="open-mono">BASELINE</div>
      <div id="open-net" class="open-mono">Injective mainnet</div>
      <div id="open-date" class="open-mono">Sun 8 Nov 2026, 18:48 to 20:47 UTC</div>
      <svg id="open-rule" viewBox="0 0 724 20" width="724" height="20" aria-hidden="true">
        <line id="open-rule-line" x1="0" y1="1" x2="720" y2="1" stroke="#B4AFA3" stroke-width="1.5" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
        <g id="open-rule-ticks"></g>
      </svg>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // The measured rule: a tick every 24 px, a longer one every 120 px, each appearing as the line reaches it
      const RULE = { at: 1.45, dur: 0.9, length: 720 };
      const ticks = document.getElementById("open-rule-ticks");
      const SVGNS = "http://www.w3.org/2000/svg";
      // Inverse of power2.inOut: the moment the drawing line reaches a given fraction of its length
      const reachTime = (p) => (p < 0.5 ? Math.sqrt(p / 2) : 1 - Math.sqrt((1 - p) / 2));
      for (let x = 0; x <= RULE.length; x += 24) {
        const major = x % 120 === 0;
        const line = document.createElementNS(SVGNS, "line");
        line.setAttribute("x1", x + 0.75);
        line.setAttribute("x2", x + 0.75);
        line.setAttribute("y1", 1);
        line.setAttribute("y2", 1);
        line.setAttribute("stroke", major ? "#B4AFA3" : "#8E897E");
        line.setAttribute("stroke-width", 1.5);
        ticks.appendChild(line);
        const t = RULE.at + RULE.dur * reachTime(x / RULE.length);
        tl.fromTo(line, { attr: { y2: 1 } }, { attr: { y2: major ? 18 : 9 }, duration: 0.22, ease: "expo.out" }, t);
      }
      tl.fromTo("#open-rule-line", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: RULE.dur, ease: "power2.inOut" }, RULE.at);

      // Each line of the block lands on the word that names it, whole-line blur in
      const line = (sel, t) =>
        tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, t);
      line("#open-ticker", 1.66); // "real" 1.78
      line("#open-badge", 2.3); // "book." 2.44
      line("#open-net", 4.14); // "Injective" 4.27
      line("#open-date", 5.74); // "Sunday" 5.87

      window.__timelines["open"] = tl;
    })();
  </script>
</template>
