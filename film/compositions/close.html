<template>
  <style>
    @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/BricolageGrotesque-latin.woff2") format("woff2"); font-weight: 200 800; font-stretch: 75% 100%; font-style: normal; }
    @font-face { font-family: "Martian Mono"; src: url("assets/fonts/MartianMono-latin.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; font-style: normal; }
    /* Terrain-world type: chalk with the ochre accent. On the real B6 the sky glows peach toward the horizon (chalk falls under
       3:1 below y 190 and ochre under 3:1 below y 50), while the far land just under the horizon is dark and calm
       (chalk 4.7 to 12:1, ochre 6 to 8:1, muted 5.6 to 7.8:1 over y 380 to 610), so the type rests there. */
    #root { position: absolute; inset: 0; overflow: hidden; background: #0D0F0E; --close-ink: #ECE8DF; --close-accent: #E9A94B; --close-muted: #B4AFA3; }
    .close-display { font-family: "Bricolage Grotesque", sans-serif; font-weight: 480; font-stretch: 92%; font-variation-settings: "opsz" 96; letter-spacing: -0.027em; line-height: 0.98; }
    .close-mono { font-family: "Martian Mono", monospace; font-stretch: 87.5%; font-feature-settings: "tnum" 1, "zero" 1; }

    #close-b6 { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }

    /* Both blocks are placed vertically from SKY in the script; only their size is set here. */
    #close-title { position: absolute; left: 0; width: 1920px; height: 180px; text-align: center; color: var(--close-ink); font-size: 88px; }
    .close-line { position: absolute; left: 0; width: 1920px; white-space: nowrap; }
    #close-l1 { top: 0; }
    #close-l2 { top: 94px; }
    .close-accent { color: var(--close-accent); }

    /* End card lockup: wordmark 500 px wide (26% of the frame), its seam at 41.2 to 45.6 of the 68.6 viewBox. */
    #close-card { position: absolute; left: 0; width: 1920px; height: 203px; }
    #close-mark { position: absolute; left: 710px; top: 0; width: 500px; height: 62.6px; }
    #close-wm { position: absolute; left: 0; top: 0; width: 500px; height: 62.6px; }
    /* The pen: a short ochre dash in the seam gap whose front edge is the reveal's leading point; cropped to the mark by its wrap. */
    #close-seam-wrap { position: absolute; left: 0; top: 38.1px; width: 500px; height: 3px; overflow: hidden; }
    #close-seam { position: absolute; left: 0; top: 0; width: 64px; height: 3px; background: var(--close-accent); }
    /* Provenance: the B6 land is the real NVDA book with illustrative STRATA deposits added (assets/blender/README.md). */
    #close-illus { position: absolute; left: 96px; top: 822px; font-size: 28px; font-weight: 400; line-height: 1.3; color: #B4AFA3; white-space: nowrap; }
    .close-url { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 32px; font-weight: 400; line-height: 1.5; color: var(--close-muted); white-space: nowrap; }
    #close-url1 { top: 106.6px; }
    #close-url2 { top: 154.6px; }
  </style>
  <div id="root" data-composition-id="close" data-width="1920" data-height="1080" data-duration="12.5">
    <!-- B6 is 7 s; at 0.75 the plate keeps moving for 9.33 s, until the end card has landed, then rests on its last frame. -->
    <video id="close-b6" class="clip" src="assets/video/b6.mp4" muted playsinline data-start="0" data-duration="12.5" data-playback-rate="0.75" data-track-index="0"></video>

    <div id="close-illus" class="clip close-mono" data-start="0" data-duration="7.8" data-track-index="3">Illustration: STRATA depth added to the real NVDA/USDC PERP book</div>

    <div id="close-title" class="clip close-display" data-start="2.2" data-duration="5.85" data-track-index="1">
      <div id="close-l1" class="close-line">Injective has the markets.</div>
      <div id="close-l2" class="close-line">STRATA brings the <span class="close-accent">liquidity</span>.</div>
    </div>

    <div id="close-card" class="clip" data-start="7.95" data-duration="4.55" data-track-index="2">
      <div id="close-mark">
        <img id="close-wm" src="assets/brand/wordmark-dark.svg" alt="STRATA" />
        <div id="close-seam-wrap"><div id="close-seam"></div></div>
      </div>
      <div id="close-url1" class="close-url close-mono">strata-web-ochre.vercel.app</div>
      <div id="close-url2" class="close-url close-mono">github.com/Adwaitbytes/strata</div>
    </div>
  </div>
  <script>
    // The B6 plate (7 s, 15:42 render): its horizon holds at y 350 for the whole shot. Titles and the end card rest on the
    // dark far land just under it; the sky above stays clear. Retune here if the plate changes.
    const SKY = { horizon: 350, gap: 40 };
    document.getElementById("close-title").style.top = `${SKY.horizon + SKY.gap}px`;
    document.getElementById("close-card").style.top = `${SKY.horizon + SKY.gap}px`;

    // Seam wipe geometry, in % of the wordmark box: the top strata end at 60.06%, the bottom strata start at 66.47%.
    // The reveal is a chevron whose point rides the seam 12% ahead of its top and bottom edges,
    // so the letters rise and fall out of the seam just behind the pen.
    const chevron = (h) => `polygon(0% 0%, ${h - 12}% 0%, ${h}% 60.06%, ${h}% 66.47%, ${h - 12}% 100%, 0% 100%)`;

    const tl = gsap.timeline({ paused: true });

    // 2.28 "Injective has the markets." whole line blurs in, in the sky.
    tl.fromTo("#close-l1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 2.28);
    // 5.05 "STRATA brings the liquidity." second line, accent on liquidity.
    tl.fromTo("#close-l2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 5.05);
    tl.to("#close-title", { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, 7.72);

    // 8.0 end card: an ochre pen runs the seam left to right; the strata of the wordmark rise and fall out of it just behind the pen.
    // The dash's front edge tracks the chevron point (0 to 112% of 480 px) on the same ease, then it leaves through the right end.
    tl.fromTo("#close-seam", { x: -64 }, { x: 500 * 1.12 - 64, duration: 0.95, ease: "power2.inOut" }, 8.0);
    tl.fromTo("#close-wm", { clipPath: chevron(0) }, { clipPath: chevron(112), duration: 0.95, ease: "power2.inOut" }, 8.0);
    tl.fromTo("#close-seam-wrap", { opacity: 1 }, { opacity: 0, duration: 0.17, ease: "power2.out" }, 8.68);
    // The illustration label has stood since frame 0; it leaves about 1 s before the wordmark lands.
    tl.to("#close-illus", { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power3.in" }, 7.5);
    tl.fromTo("#close-url1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 9.05);
    tl.fromTo("#close-url2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 9.15);

    window.__timelines["close"] = tl;
  </script>
</template>
