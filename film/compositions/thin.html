    <div id="thin-t3" class="clip thin-title thin-display" data-start="11.2" data-duration="3.8" data-track-index="6"><span class="thin-w">They</span> <span class="thin-w">need</span> <span class="thin-w">a</span> <span class="thin-w">place</span> <span class="thin-w">to</span> <span class="thin-w thin-acc">prove</span> <span class="thin-w">it</span></div>

  <script>
    // The 188-tick strip from `measure`, same geometry (x positions match that scene tick for tick):
    // markets sorted equity, fx, commodity, index, compute, then ticker (assets/data/rwa-sweep.json,
    // Mon 9 Nov 2026 08:42:45 UTC). The three equities with a bid and an ask within 0.25% of mark stay ochre:
    // META (equity 86), MSTR (95), SPCX (137). The rest are hollow, as `measure` leaves them.
    const THIN_GROUPS = [166, 11, 8, 2, 1];
    const THIN_BOTH = new Set([86, 95, 137]);
    const THIN_STRIP = { left: 96, pitch: 8, width: 5, gap: 56, top: 700, base: 840 };

    const thinTicks = [];
    (() => {
      const ns = "http://www.w3.org/2000/svg";
      const g = document.getElementById("thin-ticks");
      let gx = THIN_STRIP.left;
      THIN_GROUPS.forEach((count, gi) => {
        for (let k = 0; k < count; k += 1) {
          const both = gi === 0 && THIN_BOTH.has(k);
          const r = document.createElementNS(ns, "rect");
          r.setAttribute("x", String(gx + k * THIN_STRIP.pitch + 0.625));
          r.setAttribute("y", String(THIN_STRIP.top));
          r.setAttribute("width", String(THIN_STRIP.width - 1.25));
          r.setAttribute("height", String(THIN_STRIP.base - THIN_STRIP.top));
          r.setAttribute("stroke-width", "1.25");
          if (both) {
            r.setAttribute("fill", "#E9A94B");
            r.setAttribute("stroke", "#E9A94B");
          } else {
            r.setAttribute("fill", "none");
            r.setAttribute("stroke", "#ECE8DF");
            r.setAttribute("stroke-opacity", "0.45");
          }
          g.appendChild(r);
          thinTicks.push({ el: r, x: gx + k * THIN_STRIP.pitch });
        }
        gx += count * THIN_STRIP.pitch + THIN_STRIP.gap;
      });
    })();

    const tl = gsap.timeline({ paused: true });
    const blurIn = { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" };
    const blurFrom = { opacity: 0, filter: "blur(8px)" };
    const STEP_BACK = "#8E897E";

    // Beat 1 (0 to 3.55): the gold book builds on "Why so thin?" (Why 0.49) and holds
    tl.fromTo("#thin-asksclip-r", { attr: { width: 0 } }, { attr: { width: 1020 }, duration: 0.5, ease: "power2.inOut" }, 0.06);
    tl.fromTo("#thin-noasks-t", blurFrom, { ...blurIn }, 0.4);
    tl.fromTo("#thin-bid1", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0.3);
    tl.fromTo("#thin-bar1", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.3);
    tl.fromTo("#thin-bid2", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0.42);
    tl.fromTo("#thin-bar2", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 0.42);

    // Blur swap on "closed job" (job 3.34): the paper defocuses away, basalt type arrives
    tl.fromTo("#thin-paper", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(14px)", duration: 0.24, ease: "power3.in" }, 3.45);
    tl.fromTo("#thin-t1 .thin-w", blurFrom, { ...blurIn, stagger: 0.08 }, 3.62);

    // the strip rises off its datum left to right while "A handful of firms do it" (handful 4.15)
    tl.fromTo("#thin-base", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.9);
    thinTicks.forEach(({ el, x }) => {
      const at = 4.0 + (0.9 * (x - THIN_STRIP.left)) / (1824 - THIN_STRIP.left);
      tl.fromTo(el, { attr: { y: THIN_STRIP.base, height: 0 } }, { attr: { y: THIN_STRIP.top, height: THIN_STRIP.base - THIN_STRIP.top }, duration: 0.3, ease: "expo.out" }, at);
    });

    // "you can't tell how well" (can't 7.04)
    tl.fromTo("#thin-sub1", blurFrom, { ...blurIn }, 6.92);

    // "AI agents could do this work" (AI 8.24) lands under it; the lines above step back
    tl.fromTo("#thin-t2 .thin-w", blurFrom, { ...blurIn, stagger: 0.08 }, 8.12);
    tl.to(["#thin-t1", "#thin-t1 .thin-acc", "#thin-sub1"], { color: STEP_BACK, duration: 0.35, ease: "power2.out" }, 8.12);

    // "They need a place to prove it": each word lands with its spoken word
    const THIN_T3_AT = [11.37, 11.66, 12.16, 12.88, 13.24, 13.38, 13.74];
    document.querySelectorAll("#thin-t3 .thin-w").forEach((w, i) => {
      tl.fromTo(w, blurFrom, { ...blurIn }, THIN_T3_AT[i]);
    });
    tl.to(["#thin-t2", "#thin-t2 .thin-acc"], { color: STEP_BACK, duration: 0.35, ease: "power2.out" }, 11.37);

    window.__timelines["thin"] = tl;
  </script>
