    const q = (s, r = document) => r.querySelector(s);
    const qa = (s, r = document) => Array.from(r.querySelectorAll(s));

    // Axis ticks: major every 100, mid every 50, minor every 10 (tick size is 1).
    let dMaj = "", dMid = "", dMin = "";
    for (let p = P_HI; p >= P_LO; p -= 10) {
      const y = yOf(p).toFixed(2);
      if (p % 100 === 0) dMaj += `M${AX - 24} ${y}H${AX}`;
      else if (p % 50 === 0) dMid += `M${AX - 16} ${y}H${AX}`;
      else dMin += `M${AX - 9} ${y}H${AX}`;
    }
    q("#agent-ticks-major").setAttribute("d", dMaj);
    q("#agent-ticks-mid").setAttribute("d", dMid);
    q("#agent-ticks-minor").setAttribute("d", dMin);

    // Bottom survey ruler along the panel: a tick every 24 px, a longer one every 120 px.
    let dR = "";
    for (const x0 of [120, 2040]) for (let x = x0; x <= x0 + 1680; x += 24) dR += `M${x} 883V${(x - x0) % 120 === 0 ? 869 : 876}`;
    q("#agent-ruler-path").setAttribute("d", dR);

    qa(".agent-plab, .agent-row").forEach((el) => { el.style.top = `${yOf(+el.dataset.price)}px`; });
    ["#agent-fair-pin", "#agent-fair-line"].forEach((s) => { q(s).style.top = `${yOf(74280.55)}px`; });
    q("#agent-fair-lab").style.top = `${yOf(74280.55) - 46}px`;
    q("#agent-fair-src").style.top = `${yOf(74280.55) + 14}px`;

    qa(".agent-ord").forEach((el) => {
      const w = +el.dataset.size * BAR_PX_PER_UNIT;
      el.style.top = `${yOf(+el.dataset.price)}px`;
      q(".agent-bar", el).style.width = `${w}px`;
    });
    qa(".agent-olab").forEach((el) => {
      el.style.top = `${yOf(+el.dataset.price)}px`;
      el.style.left = `${492 + +el.dataset.size * BAR_PX_PER_UNIT + 24}px`;
    });
    qa(".agent-side").forEach((el) => {
      const [p0, p1] = el.dataset.prices.split(",").map(Number);
      el.style.top = `${(yOf(p0) + yOf(p1)) / 2}px`;
    });
    qa(".agent-ghost").forEach((el) => {
      el.style.top = `${yOf(+el.dataset.price)}px`;
      el.style.width = `${+el.dataset.size * BAR_PX_PER_UNIT}px`;
    });

    // Knobs: log tracks for the wide ranges, linear for levels, two stops for off-hours.
    const frac = (k, v) => {
      const lo = +k.dataset.min, hi = +k.dataset.max;
      return k.dataset.scale === "log" ? Math.log(v / lo) / Math.log(hi / lo) : (v - lo) / (hi - lo);
    };
    const tx = (k, v) => TRACK_X + frac(k, v) * TRACK_W;
    qa(".agent-knob").forEach((k, i) => {
      k.style.top = `${176 + i * 118}px`;
      const v = +k.dataset.val;
      q(".agent-kneedle", k).style.left = `${tx(k, v)}px`;
      q(".agent-kcap-l", k).style.left = `${TRACK_X - 1.5}px`;
      q(".agent-kcap-r", k).style.left = `${TRACK_X + TRACK_W - 1.5}px`;
      const marks = k.dataset.decades ? k.dataset.decades.split(",").map(Number)
        : k.dataset.steps ? Array.from({ length: +k.dataset.max - +k.dataset.min - 1 }, (_, j) => +k.dataset.min + 1 + j) : [];
      marks.forEach((m) => {
        const d = document.createElement("div");
        d.className = "agent-kdec";
        d.style.left = `${tx(k, m) - 1}px`;
        k.insertBefore(d, q(".agent-ktrack", k).nextSibling);
      });
      if (k.dataset.band) {
        const b = q(".agent-kband", k);
        const x0 = tx(k, v * 0.8), x1 = tx(k, v * 1.2);
        b.style.left = `${x0}px`;
        b.style.width = `${x1 - x0}px`;
      }
      if (k.dataset.ghost) {
        const gx = tx(k, +k.dataset.ghost);
        q(".agent-kghost", k).style.left = `${gx}px`;
        q(".agent-kghost-lab", k).style.left = `${gx}px`;
      }
    });

    // The rationale types in: split into word spans of char spans so wrapping stays natural.
    const why = q("#agent-why");
    const words = why.textContent.trim().split(/\s+/);
    why.textContent = "";
    words.forEach((w, i) => {
      const ws = document.createElement("span");
      ws.style.whiteSpace = "nowrap";
      for (const ch of w) {
        const c = document.createElement("span");
        c.className = "agent-ch";
        c.textContent = ch;
        ws.appendChild(c);
      }
      why.appendChild(ws);
      if (i < words.length - 1) why.appendChild(document.createTextNode(" "));
    });
    const chars = qa(".agent-ch", why);

    const tl = gsap.timeline({ paused: true });
    const blurIn = (t, s, d = 0.3) => tl.fromTo(s, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out" }, t);
    const blurOut = (t, s, d = 0.3) => tl.to(s, { opacity: 0, filter: "blur(6px)", duration: d, ease: "power3.in" }, t);

    // Camera
    tl.set("#agent-cam", { x: CAM_A, y: 0, scale: 1 }, 0);
    tl.to("#agent-cam", { x: CAM_B, duration: 1.3, ease: "power2.inOut" }, 11.55);
    // Horizontal-only motion blur on the long pan, peaking at its fastest frame.
    tl.set("#agent-cam", { filter: "url(#agent-hblur)" }, 11.6);
    tl.fromTo("#agent-hblur-k", { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: "14 0" }, duration: 0.6, ease: "power2.in" }, 11.6);
    tl.to("#agent-hblur-k", { attr: { stdDeviation: "0 0" }, duration: 0.6, ease: "power2.out" }, 12.2);
    tl.set("#agent-cam", { filter: "none" }, 12.8);
    tl.fromTo("#agent-knobs", { x: KNOB_SHIFT }, { x: 0, duration: 1.0, ease: "power2.inOut" }, 16.6);

    // Beat 1 (0 to 4.4): "Inside, the agent doesn't try to guess where the price is going."
    blurIn(1.6, "#agent-time-a");
    tl.fromTo("#agent-inv-track", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 2.3);
    tl.fromTo(".agent-inv-tick, #agent-inv-mid", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.75);
    blurIn(2.45, "#agent-inv-name, .agent-inv-lab");
    tl.set("#agent-inv-fill", { scaleX: 0 }, 0);
    tl.set("#agent-illus, #agent-lean", { opacity: 0 }, 0);
    blurIn(3.55, "#agent-axis-cap");

    // On "Inside": the four real resting orders snap onto their ticks.
    const snaps = [["#agent-b1", 6, 0.6], ["#agent-a1", -6, 0.78], ["#agent-b2", 6, 0.96], ["#agent-a2", -6, 1.14]];
    snaps.forEach(([id, dy, t]) => {
      tl.fromTo(`${id}, ${id}-lab`, { y: dy, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, t);
      tl.fromTo(`${id} .agent-bar`, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, t);
    });

    // Beat 2 (4.4 to 7.7): "quotes both sides around a fair price".
    blurIn(4.55, "#agent-side-a", 0.25);
    blurIn(5.05, "#agent-side-b", 0.25);
    tl.fromTo("#agent-fair-pin", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 6.42);
    tl.fromTo("#agent-fair-line", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 6.42);
    blurIn(6.6, "#agent-fair-lab", 0.25);
    blurIn(6.95, "#agent-fair-src");

    // Beat 3 (7.7 to 11.5): illustration, inventory grows long and the quote set leans down, then returns.
    blurIn(7.78, "#agent-illus", 0.25);
    tl.fromTo("#agent-ghosts", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 8.0);
    tl.to("#agent-inv-fill", { scaleX: 1, duration: 2.8, ease: "power1.inOut" }, 8.1);
    tl.to("#agent-quotes", { y: SKEW_USD * K, duration: 2.8, ease: "power1.inOut" }, 8.1);
    blurIn(8.35, "#agent-lean", 0.35);
    tl.to("#agent-inv-flat", { color: "#8E897E", duration: 0.3, ease: "power2.out" }, 8.4);
    tl.to("#agent-inv-long", { color: "#ECE8DF", duration: 0.3, ease: "power2.out" }, 9.9);
    tl.to("#agent-inv-fill", { scaleX: 0, duration: 0.5, ease: "power2.inOut" }, 10.95);
    tl.to("#agent-quotes", { y: 0, duration: 0.5, ease: "power2.inOut" }, 10.95);
    tl.to("#agent-inv-flat", { color: "#ECE8DF", duration: 0.3, ease: "power2.out" }, 11.2);
    tl.to("#agent-inv-long", { color: "#8E897E", duration: 0.3, ease: "power2.out" }, 11.2);
    tl.to("#agent-ghosts", { opacity: 0, duration: 0.25, ease: "power3.in" }, 11.15);
    blurOut(11.1, "#agent-illus, #agent-lean", 0.25);

    // Beat 4 (11.5 to 16.5): pan to the tuner; five knobs land, then the hard limits light up.
    tl.fromTo(".agent-ktrack", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut", stagger: 0.07 }, 12.35);
    tl.fromTo(".agent-kdec", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 12.9);
    blurIn(12.95, "#agent-lognote");
    qa(".agent-knob").forEach((k, i) => {
      const t = 13.4 + i * 0.14;
      tl.fromTo(q(".agent-kneedle", k), { y: -6, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, t);
      blurIn(t, q(".agent-kval", k), 0.25);
    });
    tl.fromTo(".agent-kcap", { scaleY: 0.5, backgroundColor: "#4A514C" }, { scaleY: 1, backgroundColor: "#ECE8DF", duration: 0.35, ease: "expo.out", stagger: 0.04 }, 14.9);
    tl.to(".agent-kmin, .agent-kmax", { color: "#ECE8DF", duration: 0.35, ease: "power2.out" }, 14.9);
    tl.fromTo(".agent-kband", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out", stagger: 0.06 }, 15.3);
    blurIn(15.3, "#agent-clamp", 0.25);

    // Beat 5 (16.5 to 21.2): shadow mode. The real suggestion lands, its changes show as ghost needles, the rationale types in.
    tl.fromTo("#agent-card", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 17.25);
    tl.set("#agent-card-time, #agent-chg1, #agent-chg2, .agent-card-rule, #agent-shadow, .agent-kghost, .agent-kghost-lab", { opacity: 0 }, 0);
    tl.set(chars, { opacity: 0 }, 0);
    blurIn(17.3, "#agent-hdr-b2");
    blurIn(17.6, "#agent-shadow", 0.18);
    tl.to(".agent-card-rule", { opacity: 1, duration: 0.3, ease: "power2.out" }, 17.8);
    blurIn(17.95, "#agent-card-time");
    blurIn(18.62, "#agent-chg1", 0.25);
    const g1 = tx(q("#agent-k1"), 12) - tx(q("#agent-k1"), 10);
    tl.fromTo("#agent-k1 .agent-kghost", { x: -g1, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 18.7);
    blurIn(18.85, "#agent-k1 .agent-kghost-lab", 0.25);
    blurIn(18.98, "#agent-chg2", 0.25);
    const g3 = tx(q("#agent-k3"), 0.9) - tx(q("#agent-k3"), 1);
    tl.fromTo("#agent-k3 .agent-kghost", { x: -g3, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 19.05);
    blurIn(19.2, "#agent-k3 .agent-kghost-lab", 0.25);
    tl.to(chars, { opacity: 1, duration: 0.05, ease: "none", stagger: { amount: 1.7 } }, 19.1);

    // Beat 6 (21.2 to end): "and it never places an order."
    tl.fromTo("#agent-final .agent-w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.08, ease: "power2.out" }, 21.2);

    window.__timelines["agent"] = tl;
  </script>
</template>
