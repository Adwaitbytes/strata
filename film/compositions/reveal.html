  <script>
    // Screen y (px) of B3's ochre layer (STRATA depth). The lead retunes this one number when the real
    // render lands: the ochre line, the wordmark's seam, and the lockup under it all follow it.
    // Keep it inside 260..760 so the lockup stays clear of the caption band (y > 900).
    const OCHRE_Y = 640;

    // Wordmark geometry (assets/brand/wordmark-dark.svg, viewBox 548 x 68.6, seam y 41.2 to 45.6).
    const WM_W = 760;
    const WM_H = (WM_W * 68.6) / 548;
    const SEAM_TOP = (41.2 / 68.6) * WM_H;
    const SEAM_BOT = (45.6 / 68.6) * WM_H;
    const WM_TOP = OCHRE_Y - (SEAM_TOP + SEAM_BOT) / 2;
    const px = (n) => `${n.toFixed(2)}px`;

    document.getElementById("reveal-linewrap").style.top = px(OCHRE_Y - 1.5);
    document.getElementById("reveal-wm").style.top = px(WM_TOP);
    // each half of the wordmark sits in a box that ends at the seam, so it rises out of the line
    const boxTop = document.getElementById("reveal-box-top");
    boxTop.style.top = "0px";
    boxTop.style.height = px(SEAM_TOP);
    const boxBot = document.getElementById("reveal-box-bot");
    boxBot.style.top = px(SEAM_BOT);
    boxBot.style.height = px(WM_H - SEAM_BOT);
    document.getElementById("reveal-wm-bot").style.top = px(-SEAM_BOT);
    // The lockup sits under the wordmark; if the stratum is low in frame it moves above instead.
    const LOCKUP_BELOW = OCHRE_Y <= 640;
    const SUB_TOP = LOCKUP_BELOW ? WM_TOP + WM_H + 40 : WM_TOP - 190;
    document.getElementById("reveal-sub").style.top = px(SUB_TOP);
    document.getElementById("reveal-built").style.top = px(SUB_TOP + 67 + 30);

    const tl = gsap.timeline({ paused: true });

    // 0 to 4.1: the land alone. "So we built one." (3.19 to 4.96)
    // 4.10: the ochre line draws across the frame along the ochre layer
    tl.fromTo("#reveal-line", { scaleX: 0 }, { scaleX: 1, duration: 0.75, ease: "power2.inOut" }, 4.1);

    // "STRATA" (4.96): the letters rise out of the line, top halves up, bottom halves down
    tl.fromTo("#reveal-wm-top", { y: SEAM_TOP }, { y: 0, duration: 0.9, ease: "expo.out" }, 4.84);
    tl.fromTo("#reveal-wm-bot", { y: -(WM_H - SEAM_BOT) }, { y: 0, duration: 0.9, ease: "expo.out" }, 4.94);

    // the line gathers in from the frame edges to the wordmark's width, then closes into its cut
    tl.fromTo("#reveal-linewrap", { scaleX: 1 }, { scaleX: WM_W / 1920, duration: 0.8, ease: "power3.inOut" }, 5.0);
    tl.to("#reveal-line", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 5.72);

    // "arena" (6.39)
    tl.fromTo("#reveal-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 6.26);
    // the deposits are illustrative (film/assets/blender/README.md): say so while they fall
    tl.fromTo("#reveal-illus", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.5);
    tl.to("#reveal-illus", { opacity: 0, duration: 0.3, ease: "power3.in" }, 4.1);
    // "built on Injective" (built 8.6)
    tl.fromTo("#reveal-built", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 8.48);

    window.__timelines["reveal"] = tl;
  </script>
